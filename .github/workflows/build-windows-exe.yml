name: Build Windows Standalone EXE

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (No package-lock cache required)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend & Tauri CLI Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Windows .ico and .png Icons from SVG
        run: npx tauri icon src-tauri/icons/app-icon.svg

      - name: Build Standalone Native Windows .exe (No Bundle Required)
        run: npx tauri build --no-bundle --ci --ignore-version-mismatches

      - name: Build Optional NSIS Windows Installer
        continue-on-error: true
        run: npx tauri build --bundles nsis --ci --ignore-version-mismatches

      - name: Prepare Portable Single-File AuraLine-Portable.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-exe
          if (Test-Path "src-tauri/target/release/auraline-native.exe") {
            Copy-Item "src-tauri/target/release/auraline-native.exe" "dist-exe/AuraLine-Portable.exe" -Force
          } else {
            Get-ChildItem "src-tauri/target/release/*.exe" | Select-Object -First 1 | Copy-Item -Destination "dist-exe/AuraLine-Portable.exe" -Force
          }

      - name: Upload AuraLine-Portable.exe (免安装绿色单文件版)
        uses: actions/upload-artifact@v4
        with:
          name: AuraLine-Portable-exe
          path: dist-exe/AuraLine-Portable.exe
          if-no-files-found: error

      - name: Upload Windows Installer Bundles (NSIS 安装包)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraLine-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
